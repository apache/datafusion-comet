  # GitHub's merge queue. Classic `protected_branches` above has no way to
  # express this, but .asf.yaml rulesets accept a raw Rulesets API payload, so
  # no INFRA ticket is needed. Same approach as apache/iceberg-python and
  # apache/seatunnel; GitHub evaluates rulesets and classic branch protection
  # together and applies the most restrictive result.
  #
  # Only the default branch is queued. Merge queue rules do not support
  # wildcard ref patterns, so the branch-N.M release branches keep plain
  # branch protection.
  rulesets:
    - name: Merge Queue
      target: branch
      enforcement: active
      bypass_actors:
        # apache/root - ASF Infra, so a wedged queue can always be recovered.
        - actor_id: 118420
          actor_type: Team
          bypass_mode: always
      conditions:
        ref_name:
          include:
            - "~DEFAULT_BRANCH"
          exclude: []
      rules:
        - type: merge_queue
          parameters:
            # Matches enabled_merge_buttons above: squash is the only method
            # the repository allows.
            merge_method: SQUASH
            # ALLGREEN: every entry's own build has to be green, not just the
            # last one's. HEADGREEN would let an entry whose build failed ride
            # in on a green head, which papers over a flake but equally papers
            # over a real failure that a later entry happens to mask.
            grouping_strategy: ALLGREEN
            # Speculation depth: how many merge_group builds run at once. Each
            # queue entry gets its own build of itself plus everything ahead of
            # it, and merge limits do not combine those builds, so this is the
            # throughput dial. At 1 every merge serializes behind a ~2.5h
            # pipeline; 2 sustains roughly 19 merges a day, against a median of
            # 6 and a busiest-day 22 over the last month. Raise it if the queue
            # backs up, at the price of that many concurrent pipelines.
            max_entries_to_build: 2
            # These only cap how many already-green entries land in one merge;
            # they do not batch the builds. No minimum and no wait, so a lone
            # PR merges the moment its build is green.
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 0
            max_entries_to_merge: 5
            # Full pipeline runs have been observed at 2h04m-2h25m, on top of
            # ASF runner scheduling delays. Anything under ~4h would evict
            # healthy entries.
            check_response_timeout_minutes: 300
  pull_requests:
    allow_update_branch: true
    # Lets a committer queue a PR before its checks have finished, which is
    # most of the point of having a queue.
    allow_auto_merge: true
# publishes the content of the `asf-site` branch to
# https://datafusion.apache.org/comet/
publish:
  whoami: asf-site
  subdir: comet
