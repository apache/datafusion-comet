notifications:
  commits: commits@datafusion.apache.org
  issues: github@datafusion.apache.org
  pullrequests: github@datafusion.apache.org
  discussions: github@datafusion.apache.org
  jira_options: link label worklog
github:
  description: "Apache DataFusion Comet Spark Accelerator"
  homepage: https://datafusion.apache.org/comet
  labels:
    - arrow
    - datafusion
    - rust
    - spark
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false
  features:
    issues: true
    discussions: true
    projects: true
  protected_branches:
    main:
      required_pull_request_reviews:
        required_approving_review_count: 1
      required_status_checks:
        # `Required Checks` is the aggregator job at the bottom of
        # .github/workflows/ci.yml. It is deliberately the only entry: the
        # individual heavy jobs publish a different check name depending on
        # whether they ran or were skipped, so none of them can be required
        # directly. dev/ci/check-ci-config.py keeps this string in sync with
        # the job's `name:`.
        #
        # Careful when editing this list. A context that never reports blocks
        # every merge to main, including the merge that would fix this file,
        # and recovering from that needs an INFRA Jira ticket.
        contexts:
          - "Required Checks"
    branch-0.1:
      required_pull_request_reviews:
        required_approving_review_count: 1
    branch-0.2:
      required_pull_request_reviews:
        required_approving_review_count: 1
    branch-0.3:
      required_pull_request_reviews:
        required_approving_review_count: 1
