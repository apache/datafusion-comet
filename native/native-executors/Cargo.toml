# Comet Native Executors: the comet-scheduler and comet-executor binaries, built on Apache
# DataFusion Ballista. See https://github.com/apache/datafusion-comet/issues/7288.
#
# This is its own workspace, with its own lockfile, so that the main Comet build never depends
# on Ballista. It builds Comet's native crates by path together with the Ballista release on the
# same DataFusion major version.
[workspace]

[package]
name = "comet-native-executors"
homepage = "https://datafusion.apache.org/comet"
repository = "https://github.com/apache/datafusion-comet"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
description = "Apache DataFusion Comet: native executors and scheduler built on Apache DataFusion Ballista"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
# Ballista and DataFusion are pinned to git revisions because no Ballista release is on DataFusion
# 56 yet: the revisions are apache/datafusion-ballista#2718 (DataFusion 56 at the commit the main
# workspace uses, Arrow 60). Move back to a release once Ballista ships one.
arrow-flight = "60.0.0"
ballista-core = { git = "https://github.com/andygrove/datafusion-ballista", rev = "0acbe596270031031c8d1feed15989ed5fd7224a" }
ballista-executor = { git = "https://github.com/andygrove/datafusion-ballista", rev = "0acbe596270031031c8d1feed15989ed5fd7224a", default-features = false, features = ["arrow-ipc-optimizations"] }
ballista-scheduler = { git = "https://github.com/andygrove/datafusion-ballista", rev = "0acbe596270031031c8d1feed15989ed5fd7224a", default-features = false }
datafusion = { git = "https://github.com/apache/datafusion", rev = "1635ed94742c1c060852bc34dc6ebb2302241c7b", default-features = false }
# Comet's core crate, under the name of its library. Without the default hdfs-opendal feature,
# which links libjvm through libhdfs.
comet = { package = "datafusion-comet", path = "../core", default-features = false }
datafusion-comet-proto = { path = "../proto" }
datafusion-proto = { git = "https://github.com/apache/datafusion", rev = "1635ed94742c1c060852bc34dc6ebb2302241c7b" }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
prost = "0.14.3"
prost-types = "0.14.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tonic = "0.14"

[[bin]]
name = "comet-scheduler"
path = "src/bin/comet-scheduler.rs"

[[bin]]
name = "comet-executor"
path = "src/bin/comet-executor.rs"
