# Comet Native Executors: the comet-scheduler and comet-executor binaries, built on Apache
# DataFusion Ballista. See https://github.com/apache/datafusion-comet/issues/7288.
#
# This is its own workspace, with its own lockfile, so that the main Comet build never depends
# on Ballista. It builds Comet's native crates by path together with Ballista's `comet-native`
# branch, which is Ballista's main branch with the enhancements Comet Native Executors need that
# haven't merged yet (apache/datafusion-ballista#2682, #2721, #2722 and #2723), on the same
# DataFusion major version.
[workspace]

[package]
name = "comet-native-executors"
homepage = "https://datafusion.apache.org/comet"
repository = "https://github.com/apache/datafusion-comet"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
description = "Apache DataFusion Comet: native executors and scheduler built on Apache DataFusion Ballista"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
arrow-flight = "59.2.0"
ballista-core = { git = "https://github.com/apache/datafusion-ballista", branch = "comet-native" }
ballista-executor = { git = "https://github.com/apache/datafusion-ballista", branch = "comet-native", default-features = false, features = ["arrow-ipc-optimizations"] }
ballista-scheduler = { git = "https://github.com/apache/datafusion-ballista", branch = "comet-native", default-features = false }
datafusion = { version = "55.2.0", default-features = false }
# Comet's core crate, under the name of its library. Without the default hdfs-opendal feature,
# which links libjvm through libhdfs.
comet = { package = "datafusion-comet", path = "../core", default-features = false }
datafusion-comet-proto = { path = "../proto" }
datafusion-proto = "55.2.0"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
prost = "0.14.3"
prost-types = "0.14.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tonic = "0.14"

[[bin]]
name = "comet-scheduler"
path = "src/bin/comet-scheduler.rs"

[[bin]]
name = "comet-executor"
path = "src/bin/comet-executor.rs"
