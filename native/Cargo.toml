[workspace]
default-members = ["core", "spark-expr", "common", "proto", "jni-bridge", "shuffle", "operators", "comet-udf-sdk", "comet-test-udfs"]
members = ["core", "spark-expr", "common", "proto", "jni-bridge", "shuffle", "operators", "comet-udf-sdk", "comet-test-udfs"]
# Crates under ../contrib are intentionally NOT workspace members. Core pulls them in as
# optional path dependencies when their corresponding contrib feature is enabled.
# native-executors is its own workspace, so that this one never depends on Ballista.
exclude = ["../contrib", "native-executors"]
resolver = "2"

[workspace.package]
version = "1.3.0"
homepage = "https://datafusion.apache.org/comet"
repository = "https://github.com/apache/datafusion-comet"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
description = "Apache DataFusion Comet: High performance accelerator for Apache Spark"
readme = "README.md"
license = "Apache-2.0"
edition = "2021"

# The highest minimum Rust version among Comet's dependencies: iceberg-rust requires 1.95,
# above DataFusion's 1.94
rust-version = "1.95.0"

[workspace.dependencies]
arrow = { version = "60.1.0", features = ["prettyprint", "ffi", "chrono-tz"] }
arrow-data = { version = "60.1.0" }
arrow-select = { version = "60.1.0" }
async-trait = { version = "0.1" }
bytes = { version = "1.11.1" }
parquet = { version = "60.1.0", default-features = false, features = ["experimental"] }
# Tracking DataFusion's main branch (57.0.0-dev). Cargo.lock records the commit, and
# `cargo update` moves it to the branch head. The same branch is used by the
# `datafusion-functions-nested` dev-dependency in core and by the contrib crates.
datafusion = { git = "https://github.com/apache/datafusion", branch = "main", default-features = false, features = ["unicode_expressions", "crypto_expressions", "nested_expressions", "parquet"] }
datafusion-datasource = { git = "https://github.com/apache/datafusion", branch = "main" }
datafusion-functions = { git = "https://github.com/apache/datafusion", branch = "main", default-features = false, features = ["datetime_expressions"] }
datafusion-physical-expr-adapter = { git = "https://github.com/apache/datafusion", branch = "main" }
# apache/datafusion#27337 moved datafusion-spark out of DataFusion and into
# apache/datafusion-spark. That repository builds against DataFusion branch-56, so the
# [patch] section below moves its DataFusion dependencies to DataFusion main.
datafusion-spark = { git = "https://github.com/apache/datafusion-spark", branch = "main", features = ["core"] }
datafusion-comet-spark-expr = { path = "spark-expr" }
datafusion-comet-common = { path = "common" }
datafusion-comet-jni-bridge = { path = "jni-bridge" }
datafusion-comet-proto = { path = "proto" }
datafusion-comet-shuffle = { path = "shuffle" }
datafusion-comet-operators = { path = "operators" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Already in the tree through arrow's `chrono-tz` feature. Comet uses it directly only to report the
# IANA database version it bundles, which can differ from the JVM's (see NativeBase.getTzdataVersion).
chrono-tz = "0.10"
# Pinned exactly rather than left to the default caret range. The crate is pre-1.0 and every
# minor release so far has broken its API or changed what it serializes, and `hll_sketch.rs`
# sizes accumulators from the in-memory layout the crate keeps private (checked by
# `heap_size_follows_the_crates_layout`). The version moves only with a deliberate change that
# re-runs those tests and the Java fixtures in `agg_funcs/testdata`.
datasketches = { version = "=0.6.0", features = ["hll"] }
futures = "0.3.32"
# Declared once so no crate can drift to another major. That would build a second copy of the
# binding, whose `JObject` and env types are not interchangeable with this one's.
jni = "0.22.4"
num = "0.4"
rand = "0.10"
# Before upgrading `regex`, complete the Java-parity fixture gate tracked in
# https://github.com/apache/datafusion-comet/issues/5813.
regex = "1.12.3"
thiserror = "2"
object_store = { version = "0.14.2", features = ["gcp", "azure", "aws", "http"] }
url = "2.2"
aws-config = "1.8.18"
aws-credential-types = "1.2.13"
# default-features off: the STS client is built from a fully-resolved SdkConfig, so it needs none
# of aws-sdk-sts's own transport/crypto defaults, and enabling them would pull extra crates.
aws-sdk-sts = { version = "1.114.0", default-features = false }
# Pinned to a revision rather than a release because no published iceberg-rust
# version is on our arrow: 0.10.1 requires arrow/parquet ^58. Move to a plain
# version requirement once a release ships on arrow 60. Bump policy: #5645.
# The revision is the apache/iceberg-rust#3257 (Arrow 60) merge commit, the first main
# revision on arrow 60.
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "6c9739191da5e44c5c097714fa68c0e32696ba8f" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "6c9739191da5e44c5c097714fa68c0e32696ba8f", features = ["opendal-memory", "opendal-fs", "opendal-s3", "opendal-gcs", "opendal-oss", "opendal-azdls", "opendal-hdfs-native"] }
reqsign-core = "3"

# One DataFusion for the whole graph. datafusion-spark depends on DataFusion branch-56, and Comet
# and the contrib crates on DataFusion main. These entries replace every DataFusion crate that any
# of them names directly with DataFusion main. Cargo rejects a patch that points at the
# URL it patches, so the entries use the repository's former name, which GitHub redirects to
# apache/datafusion. Remove this section once datafusion-spark builds against the same DataFusion.
[patch."https://github.com/apache/datafusion"]
datafusion = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-common = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-datasource = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-doc = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-expr = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-functions = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-functions-aggregate = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-functions-aggregate-common = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-functions-nested = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-macros = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-physical-expr-adapter = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-physical-expr-common = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }
datafusion-session = { git = "https://github.com/apache/arrow-datafusion", branch = "main" }

[profile.release]
debug = true
overflow-checks = false
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# CI profile: faster compilation, same overflow behavior as release
# Use with: cargo build --profile ci
[profile.ci]
inherits = "release"
lto = false          # Skip LTO for faster linking
codegen-units = 16   # Parallel codegen (faster compile, slightly larger binary)
debug-assertions = true
panic = "unwind"     # Allow panics to be caught and logged across FFI boundary
# overflow-checks inherited as false from release
