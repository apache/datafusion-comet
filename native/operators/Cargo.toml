[package]
name = "datafusion-comet-operators"
description = "Apache DataFusion Comet: native execution operators"
version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
readme = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

publish = false

[dependencies]
arrow = { workspace = true }
datafusion = { workspace = true }
datafusion-comet-common = { workspace = true }
datafusion-comet-spark-expr = { workspace = true }
futures = { workspace = true }
parking_lot = "0.12.5"

[dev-dependencies]
criterion = { version = "0.7", features = ["async", "async_tokio", "async_std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
name = "datafusion_comet_operators"
path = "src/lib.rs"

[[bench]]
name = "explode"
harness = false
