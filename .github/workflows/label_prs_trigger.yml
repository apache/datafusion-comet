name: Label pull requests trigger

# Starts the labeler for a pull request. This run gets a read-only token and does nothing itself;
# when it completes, label_prs.yml runs from the default branch through workflow_run and writes
# the labels. Kept separate from Comet CI so labels arrive in seconds rather than after CI.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Hand off to label_prs.yml
        run: echo "Labels for pull request ${{ github.event.pull_request.number }} are applied by label_prs.yml"
