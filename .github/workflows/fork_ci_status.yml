# Mirror a contributor's fork run (ci_fork.yml) onto its pull request as the informational `CI (fork)` check,
# after upstream PR CI completes and through scheduled polling for late runs and
# reruns. The check is feedback only: `Required Checks` does not depend on it,
# because a contributor controls the workflow that produced it, and the merge
# queue runs the queue tier on the merge result.
#
# Reads fork runs and writes upstream checks using reviewed default-branch code.
# No checkout, artifacts, or code from the pull request are used here.
#
# Adapted from apache/arrow-rs#11788, apache/datafusion#25591 and apache/spark#60098.
# Test with Node.js 24:
#   node --test dev/ci/test-fork-ci-status.cjs
# Tests mock GitHub APIs. End-to-end testing needs a fork pull request after this
# workflow is installed on the default branch.
name: Fork CI status

on:
  workflow_run:
    workflows: [Comet CI]
    types: [completed]
  schedule:
    # Every 10 minutes for PRs updated in the last 3 days, and every 4 hours for all
    # open PRs (FULL_CRON in the script).
    - cron: '3,13,23,33,43,53 * * * *'
    - cron: '48 2-22/4 * * *'
  workflow_dispatch:

# No scopes by default: the job below asks for the two it needs. Every call to the
# fork's runs and workflows reads public data of another repository, which a token
# does not need a scope for.
permissions: {}

# Like DataFusion, group notifications separately from scheduled/manual sweeps.
# workflow_run identifies the fork and branch rather than the PR number.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name || 'update' }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  bridge:
    # A workflow_run for a pull request from a branch of this repository has no
    # fork run to mirror, so it never starts a job.
    if: >-
      github.repository == 'apache/datafusion-comet'
      && (github.event_name != 'workflow_run'
          || (github.event.workflow_run.event == 'pull_request'
              && github.event.workflow_run.head_repository.full_name != github.repository))
    name: Mirror the fork run
    permissions:
      checks: write
      pull-requests: read
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Create or update the check
        uses: actions/github-script@v9
        with:
          script: |
            // Adapted from apache/datafusion#25591 and apache/spark#60098. Fork results are informational:
            // contributors control their workflows; only upstream merge-queue CI gates merging.
            const CHECK = 'CI (fork)';
            const WORKFLOW = 'ci_fork.yml';
            const upstream = { owner: context.repo.owner, repo: context.repo.repo };
            const repository = upstream.owner + '/' + upstream.repo;
            const GUIDE = 'https://github.com/apache/datafusion-comet/blob/main/docs/source/contributor-guide/ci.md#pull-requests-from-forks';
            const FULL_CRON = '48 2-22/4 * * *';
            const QUICK_SYNC_DAYS = 3;
            const PAGE_SIZE = 25;
            const ACTIONS_APP_ID = 15368;
            const listing = { ...upstream, state: 'open', base: 'main', sort: 'updated', direction: 'desc' };
            const isForkPr = (pr) => pr.state === 'open' && pr.head.repo &&
              pr.head.repo.full_name.toLowerCase() !== repository.toLowerCase() && pr.base.ref === 'main';
            const externalId = (pr) => 'comet-fork-ci:' + pr.number;
            const conclusions = new Set([
              'action_required', 'cancelled', 'failure', 'neutral', 'skipped', 'success', 'timed_out',
            ]);
            const UPDATE_NOTE =
              'This check is informational: the contributor controls the fork workflow. ' +
              'The upstream merge queue runs the required CI checks on the proposed merge result. ' +
              'Scheduled updates can lag behind a rerun in the fork.';

            // An absent workflow/run is expected on a fork with Actions disabled. Other
            // API errors must fail the bridge rather than falsely reporting missing CI.
            async function optional(request) {
              try {
                return (await request()).data;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            function runPayload(pr, sha, run) {
              const status = run.status === 'completed' ? 'completed' :
                run.status === 'in_progress' ? 'in_progress' : 'queued';
              return {
                status,
                ...(status === 'completed' ? {
                  conclusion: conclusions.has(run.conclusion) ? run.conclusion : 'failure',
                } : {}),
                details_url: run.html_url,
                output: {
                  title: 'Fork CI: ' + (status === 'completed' ? run.conclusion : status),
                  summary: [
                    '[CI run on ' + pr.head.repo.full_name + '](' + run.html_url + ') for ' + sha + '.',
                    'Rerun failed checks in the fork. A green fork run tests the branch head, not its merge with main.',
                    UPDATE_NOTE,
                  ].join('\n\n'),
                  text: JSON.stringify({ head_sha: sha, run_id: run.id }),
                },
              };
            }

            function missingPayload(pr, sha, workflow) {
              const disabled = !workflow || workflow.state.startsWith('disabled');
              return {
                status: 'completed',
                conclusion: disabled ? 'action_required' : 'neutral',
                details_url: 'https://github.com/' + pr.head.repo.full_name + '/actions',
                output: {
                  title: disabled ? 'Enable CI on your fork' : 'No fork CI run for this commit',
                  summary: [
                    'No CI run was found for ' + sha + ' on ' + pr.head.repo.full_name + '.',
                    'Enable workflows in the fork’s Actions tab, sync/rebase to include the fork CI workflow, ' +
                    'then push your branch. A newly pushed run may take a moment to appear.',
                    UPDATE_NOTE,
                    '[Fork CI setup](' + GUIDE + ')',
                  ].join('\n\n'),
                  text: JSON.stringify({ head_sha: sha, run_id: null }),
                },
              };
            }

            async function writeCheck(pr, sha, check, payload) {
              if (check && check.status === payload.status &&
                  check.conclusion === (payload.conclusion || null) &&
                  check.output?.text === payload.output.text &&
                  check.output?.summary === payload.output.summary) return;
              if (check) {
                await github.rest.checks.update({ ...upstream, check_run_id: check.id, ...payload });
              } else {
                await github.rest.checks.create({
                  ...upstream, name: CHECK, head_sha: sha, external_id: externalId(pr), ...payload,
                });
              }
              core.info('#' + pr.number + ': ' + (payload.conclusion || payload.status));
            }

            async function syncCheck(pr) {
              if (!isForkPr(pr)) return;
              const fork = { owner: pr.head.repo.owner.login, repo: pr.head.repo.name };
              const sha = pr.head.sha;
              const checks = await github.paginate(github.rest.checks.listForRef, {
                ...upstream, ref: sha, check_name: CHECK, per_page: 100,
              });
              const check = checks.find((item) =>
                item.app?.slug === 'github-actions' && item.external_id === externalId(pr));

              const data = await optional(() => github.rest.actions.listWorkflowRuns({
                ...fork, workflow_id: WORKFLOW, head_sha: sha, branch: pr.head.ref, per_page: 100,
              }));
              // Ignore PR merge-ref runs. ci_fork.yml runs on push only, and tests
              // the branch head; contributors still control its code.
              const run = (data?.workflow_runs || []).filter((item) =>
                item.head_sha === sha && item.head_branch === pr.head.ref &&
                item.event === 'push'
              ).sort((a, b) => b.id - a.id)[0];
              const workflow = run ? null : await optional(() => github.rest.actions.getWorkflow({
                ...fork, workflow_id: WORKFLOW,
              }));
              const payload = run ? runPayload(pr, sha, run) : missingPayload(pr, sha, workflow);
              await writeCheck(pr, sha, check, payload);
            }

            async function notify() {
              const run = context.payload.workflow_run;
              if (run.event !== 'pull_request' || !run.head_repository ||
                  run.head_repository.full_name.toLowerCase() === repository.toLowerCase()) return;
              // GitHub can leave workflow_run.pull_requests empty for fork PRs. Resolve
              // from the API instead, and recheck the current head to ignore stale runs.
              const prs = await github.paginate(github.rest.pulls.list, {
                ...listing, head: run.head_repository.owner.login + ':' + run.head_branch, per_page: 100,
              });
              for (const pr of prs) {
                if (pr.head.sha === run.head_sha &&
                    pr.head.repo?.full_name.toLowerCase() === run.head_repository.full_name.toLowerCase()) {
                  await syncCheck(pr);
                }
              }
            }

            // GitHub aborts a GraphQL request after 10 seconds and limits its CPU time per
            // minute, so each page is followed by a pause as long as it took. A PR is never
            // synced from a page that truncated its checks or fork suites.
            const PAGE_QUERY = `
              query($owner: String!, $repo: String!, $size: Int!, $cursor: String, $appId: Int!, $check: String!) {
                repository(owner: $owner, name: $repo) {
                  pullRequests(states: OPEN, first: $size, after: $cursor,
                      orderBy: {field: UPDATED_AT, direction: DESC}) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      number updatedAt headRefOid isCrossRepository baseRefName
                      headRepository { nameWithOwner }
                      statusCheckRollup { commit { oid
                        checkSuites(first: 10, filterBy: {appId: $appId, checkName: $check}) {
                          pageInfo { hasNextPage }
                          nodes { checkRuns(first: 25, filterBy: {checkName: $check, checkType: LATEST}) {
                            pageInfo { hasNextPage }
                            nodes { databaseId status conclusion externalId text }
                          } }
                        }
                      } }
                      headRef { name target { oid ... on Commit {
                        checkSuites(first: 25, filterBy: {appId: $appId}) {
                          pageInfo { hasNextPage }
                          nodes { status conclusion branch { name }
                            workflowRun { databaseId event url file { path } } }
                        }
                      } } }
                    }
                  }
                }
              }`;
            const lower = (value) => value ? value.toLowerCase() : null;
            const runIdOf = (text) => {
              try { return JSON.parse(text).run_id; } catch { return undefined; }
            };

            // A GraphQL error can come with the rest of the page. A PR that came back null or
            // that an error's path points into fails; without a page, there is no cursor.
            async function fetchPage(cursor, errors) {
              try {
                return (await github.graphql(PAGE_QUERY, {
                  ...upstream, size: PAGE_SIZE, cursor, appId: ACTIONS_APP_ID, check: CHECK,
                })).repository.pullRequests;
              } catch (error) {
                const page = error.data?.repository?.pullRequests;
                const paths = (error.errors || []).map((item) => item.path || []);
                if (!page?.nodes || paths.some((path) => path[2] !== 'nodes' || !Number.isInteger(path[3]))) {
                  errors.push('PR page: ' + error.message);
                  return null;
                }
                const failed = (node, index) => !node || paths.some((path) => path[3] === index);
                for (const node of page.nodes.filter(failed)) errors.push('#' + (node?.number ?? '?') + ': ' + error.message);
                return { ...page, nodes: page.nodes.filter((node, index) => !failed(node, index)) };
              }
            }

            async function* openPrs(since, errors) {
              let cursor = null;
              for (;;) {
                const started = Date.now();
                const page = await fetchPage(cursor, errors);
                const took = Date.now() - started;
                if (!page) return;
                const recent = page.nodes.filter((node) => Date.parse(node.updatedAt) >= since);
                yield recent;
                if (recent.length < page.nodes.length || !page.pageInfo.hasNextPage) return;
                cursor = page.pageInfo.endCursor;
                await new Promise((resolve) => setTimeout(resolve, took));
              }
            }

            // Returns the counter the PR adds to.
            async function syncNode(node) {
              if (!node.isCrossRepository || node.baseRefName !== 'main') return 'skipped';
              const commit = node.statusCheckRollup?.commit;
              const suites = commit?.checkSuites.nodes || [];
              if (commit?.checkSuites.pageInfo.hasNextPage ||
                  suites.some((item) => item.checkRuns.pageInfo.hasNextPage)) {
                throw new Error('the head commit has more ' + CHECK + ' checks than a page holds');
              }
              const sha = node.headRefOid;
              const pr = { number: node.number, head: { repo: { full_name: node.headRepository?.nameWithOwner } } };
              // checkName filtering can repeat a check across suites.
              const checks = new Map(suites.flatMap((item) => item.checkRuns.nodes).map((item) => [item.databaseId, item]));
              const check = [...checks.values()].find((item) => item.externalId === externalId(pr));
              // Without the fork branch or repository there is no run to mirror.
              if (!node.headRef || !node.headRepository) return 'skipped';
              // The fork branch was pushed to and the PR has yet to follow.
              const target = node.headRef.target;
              if (target.oid !== sha || (commit && commit.oid !== sha)) return 'skipped';
              const run = target.checkSuites.nodes.filter((item) =>
                item.workflowRun?.file?.path === '.github/workflows/' + WORKFLOW &&
                item.workflowRun.event === 'push' && item.branch?.name === node.headRef.name
              ).map((item) => ({
                id: item.workflowRun.databaseId, status: lower(item.status),
                conclusion: lower(item.conclusion), html_url: item.workflowRun.url,
              })).sort((a, b) => b.id - a.id)[0];
              // A newer run may be past the page, and a suite without its run or workflow file
              // cannot be matched, so the per-PR REST path syncs such a PR instead.
              if (target.checkSuites.pageInfo.hasNextPage ||
                  target.checkSuites.nodes.some((item) => !item.workflowRun?.file)) {
                await syncCheck((await github.rest.pulls.get({ ...upstream, pull_number: node.number })).data);
                return 'perPr';
              }
              const [owner, repo] = pr.head.repo.full_name.split('/');
              const payload = run ? runPayload(pr, sha, run) : missingPayload(pr, sha,
                await optional(() => github.rest.actions.getWorkflow({ owner, repo, workflow_id: WORKFLOW })));
              if (!check) {
                await writeCheck(pr, sha, null, payload);
                return 'created';
              }
              const status = lower(check.status);
              const conclusion = payload.conclusion || null;
              if (status === payload.status && lower(check.conclusion) === conclusion &&
                  runIdOf(check.text) === runIdOf(payload.output.text)) return 'unchanged';
              // GitHub cannot reopen a completed check, so wait for the run's result.
              if (status === 'completed' && payload.status !== 'completed') return 'unchanged';
              const { data } = await github.rest.checks.update({
                ...upstream, check_run_id: check.databaseId, ...payload,
              });
              core.info('#' + node.number + ': ' + (payload.conclusion || payload.status));
              if (data.status === payload.status && (data.conclusion || null) === conclusion) return 'updated';
              core.warning('#' + node.number + ': GitHub kept the check at ' + (data.conclusion || data.status));
              return 'warnings';
            }

            async function update() {
              const full = context.eventName === 'workflow_dispatch' || context.payload.schedule === FULL_CRON;
              const since = full ? 0 : Date.now() - QUICK_SYNC_DAYS * 24 * 3600 * 1000;
              const count = { prs: 0, skipped: 0, created: 0, updated: 0, unchanged: 0, perPr: 0, warnings: 0 };
              const errors = [];
              for await (const nodes of openPrs(since, errors)) {
                for (const node of nodes) {
                  count.prs++;
                  // A failed PR must not prevent the others from being synced.
                  try {
                    count[await syncNode(node)]++;
                  } catch (error) {
                    errors.push('#' + node.number + ': ' + error.message);
                  }
                }
              }
              core.info((full ? 'Full' : 'Quick') + ' sync: ' + count.prs + ' PRs checked, ' +
                count.skipped + ' skipped, ' + count.created + ' created, ' + count.updated + ' updated, ' +
                count.unchanged + ' unchanged, ' + count.perPr + ' synced per PR, ' + count.warnings +
                ' warnings, ' + errors.length + ' failed.');
              if (errors.length) core.setFailed(errors.join('\n'));
            }

            if (context.eventName === 'workflow_run') await notify();
            else await update();
