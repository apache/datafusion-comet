# Single producer for the default Linux CI native library. The umbrella runs
# this whenever any Linux, Spark SQL, or Iceberg test consumer is selected.
name: Build Linux Native Library

on:
  workflow_call:

permissions:
  contents: read

env:
  RUST_VERSION: stable
  RUST_BACKTRACE: 1

jobs:
  build-native:
    name: Build Native Library
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17  # JDK only needed for JVM module proto generation

      - name: Check Rust formatting
        run: cd native && cargo fmt --all -- --check

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}

      - name: Build native library (CI profile)
        run: |
          cd native
          # CI profile: same overflow behavior as release, but faster compilation
          # (no LTO, parallel codegen)
          cargo build --profile ci
        env:
          RUSTFLAGS: "-Ctarget-cpu=x86-64-v3 -Clink-arg=-fuse-ld=bfd"

      - name: Upload native library
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: native-lib-linux
          path: native/target/ci/libcomet.so
          retention-days: 1

      - name: Save Cargo cache
        uses: actions/cache/save@v6
        # The push run is the cache warmer (see the header), and it writes only
        # when this dependency set has no entry yet. A scheduled run at the
        # same sha would only re-archive an entry that already exists.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}

  # Run Rust tests (runs in parallel with build-native, uses debug builds).
  #
  # Deliberately uncached. A debug native/target is 4-5 GB, the largest entry
  # the repository ever held, and it kept main's `cargo-ci` entry, which the
  # native builds on the critical path need, from staying resident. This job is
  # never the long pole of a run, so compiling the dependencies from scratch
  # costs about 7 runner-minutes and no wall-clock time. With no cache to write
  # it has nothing to do on push either. See issue #6387.
