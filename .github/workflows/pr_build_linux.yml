name: PR Build (Linux)

# Reusable: invoked by ci.yml. Triggering, path filters, and concurrency
# live in the umbrella workflow.
#
# Two modes, selected by `cache-refresh-only`:
#
#   false  the full pipeline: the lints, the linux-test matrix, the Rust
#          tests and the TPC-H/TPC-DS correctness runs. Pull requests and the
#          merge queue.
#   true   only the jobs that write an actions/cache entry, and each only far
#          enough to populate it. This is the push-to-main tier, where the
#          queue has already tested the exact tree that landed and the sole
#          remaining purpose of the run is to leave main's caches warm for the
#          next pull request. See the `build_linux` / `build_linux_full`
#          comments in dev/ci/compute-changes.py for why that tier exists.
#
# Within the full pipeline, `profiles` picks which Spark profiles the
# linux-test matrix runs the Comet test suites against: `pr` is the default
# build profile alone, `all` is every profile, and `nightly` is the rest.
# The rows live in dev/ci/linux-test-profiles.py, which the `lint` job runs so
# that the matrix can be built from its output. A pull request and the merge
# queue run `pr`, the nightly run `nightly`, and a pull request carrying
# `run-all-spark-profiles` runs `all`. See the `build_linux_all_profiles`
# comment in dev/ci/compute-changes.py.
#
# `nightly` is also a third mode. Whenever ci.yml passes it, the default
# profile's pipeline has already run at this commit (in the queue and the push
# run for the scheduled event, in the PR tier for a label run), so only `lint`,
# `build-native` and the `linux-test` matrix run; every other job carries
# `if: ${{ inputs.profiles != 'nightly' }}`.
#
# Keeping all three modes in this file is deliberate. The cache keys are the
# whole point of the push tier, and a separate cache-warming workflow would
# have to repeat every one of them; here they cannot drift apart.
# dev/ci/check-ci-config.py pins which jobs survive `cache-refresh-only` and
# which run under `profiles: nightly`, so a job added without either guard
# cannot quietly put the full pipeline back on those tiers.
on:
  workflow_call:
    inputs:
      cache-refresh-only:
        description: >-
          Populate main's actions/cache entries without running any lint or
          test. Set by ci.yml on push to main.
        type: boolean
        default: false
      profiles:
        # Which Spark profiles the linux-test matrix runs. `pr` is the default
        # build profile alone, `all` is every profile, `nightly` is every
        # profile except the `pr` one (the nightly run, and a `labeled` run,
        # where the PR-tier row already ran at this commit). Rows and tiers
        # are in dev/ci/linux-test-profiles.py.
        description: 'Which Spark profiles linux-test runs: all, pr (the default build profile) or nightly (the rest)'
        type: string
        default: 'all'

env:
  RUST_VERSION: stable
  RUST_BACKTRACE: 1
  # Force GNU ld on Linux: recent Rust stable defaults to rust-lld on
  # x86_64-unknown-linux-gnu, and rust-lld cannot resolve -ljvm against the
  # Zulu JDK layout installed by setup-java. Keep bfd for all cargo invocations.
  RUSTFLAGS: "-Clink-arg=-fuse-ld=bfd"

jobs:

  # Fast lint check - gates all other jobs. Runs in cache-refresh-only mode too:
  # it is 40 seconds, and `build-native` and `linux-test-rust` both `needs:` it,
  # so skipping it would skip the two jobs the push tier exists to run.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    outputs:
      # The `profile` dimension of the linux-test matrix, selected by the
      # `profiles` input. Computed here because this job already gates
      # linux-test and a job-level `if:` cannot see `matrix`.
      profile-matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Select linux-test profiles
        id: profiles
        run: python3 dev/ci/linux-test-profiles.py --profiles "${{ inputs.profiles }}" --github-output "$GITHUB_OUTPUT"

      - name: Check Rust formatting
        run: |
          rustup component add rustfmt
          cd native && cargo fmt --all -- --check

  # Fast syntactic-only scalafix check. Parses sources without compiling, so it
  # surfaces version-independent style issues (e.g. RedundantSyntax) in seconds,
  # long before the lint-java matrix finishes its ~3.5 min build. It also scans
  # the spark-4.1 / spark-4.2 sources that lint-java skips (those profiles can't
  # run -Psemanticdb yet), so it is the only gate covering them. The full rule
  # set, including the semantic rules, still runs in lint-java.
  scalafix-syntactic:
    name: Lint Scala (syntactic)
    if: ${{ !inputs.cache-refresh-only && inputs.profiles != 'nightly' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup coursier
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21

      # Split the network from the lint. `cs launch` resolves and downloads the
      # scalafix artifacts from Maven Central, which resets connections now and
      # then, so the warm-up retries a no-op `--version` run. The real check then
      # runs `--mode offline` against the populated cache: no network, and a
      # nonzero exit can only mean a lint violation, never a download failure.
      - name: Fetch scalafix
        run: |
          for attempt in 1 2 3; do
            if cs launch scalafix:0.14.6 -- --version; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::scalafix download failed after 3 attempts."
              exit 1
            fi
            echo "::warning::scalafix download failed (attempt $attempt of 3); retrying in $((attempt * 15))s."
            sleep $((attempt * 15))
          done

      - name: Run syntactic scalafix check (no compile)
        run: |
          cs launch --mode offline scalafix:0.14.6 -- \
            --check \
            --syntactic \
            --config .scalafix-syntactic.conf \
            --exclude '**/target/**' \
            spark

  lint-java:
    needs: lint
    name: Lint Java (${{ matrix.profile.name }})
    if: ${{ !inputs.cache-refresh-only && inputs.profiles != 'nightly' }}
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
      env:
        JAVA_TOOL_OPTIONS: '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED'
    strategy:
      matrix:
        profile:
          - name: "Spark 3.4, JDK 17, Scala 2.12"
            java_version: "17"
            maven_opts: "-Pspark-3.4 -Pscala-2.12"
          - name: "Spark 3.5, JDK 17, Scala 2.12"
            java_version: "17"
            maven_opts: "-Pspark-3.5 -Pscala-2.12"
          - name: "Spark 4.0, JDK 17"
            java_version: "17"
            maven_opts: "-Pspark-4.0"
          - name: "Spark 4.0, JDK 21"
            java_version: "21"
            maven_opts: "-Pspark-4.0"
          # Spark 4.1 and 4.2 are intentionally absent: the lint job invokes -Psemanticdb,
          # but semanticdb-scalac for those Scala patch versions (2.13.17 / 2.13.18) is not
          # yet published, so we cannot currently run scalafix against the spark-4.1 or
          # spark-4.2 profiles.
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: ${{ matrix.profile.java_version }}

      - name: Restore Maven dependencies
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}-lint
          restore-keys: |
            ${{ runner.os }}-java-maven-

      - name: Run scalafix check
        run: |
          ./mvnw -B package -DskipTests scalafix:scalafix -Dscalafix.mode=CHECK -Psemanticdb ${{ matrix.profile.maven_opts }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install prettier
        run: |
          npm install -g prettier

      - name: Run prettier
        run: |
          npx prettier "**/*.md" --write

      - name: Mark workspace as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check for any local git changes (such as generated docs)
        run: |
          ./dev/ci/check-working-tree-clean.sh

      # Saved only on main: an entry written from a pull request or a
      # `gh-readonly-queue/*` branch cannot be restored by any later run, and
      # it evicts main's from the shared budget. See "Large caches are written
      # on main only" in README.md.
      - name: Save Maven dependencies
        if: ${{ github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}-lint

  # Compile-only verification for Spark 4.1. Tests are intentionally skipped: the spark-4.1
  # profile is currently a build target only, and several runtime/test failures are tracked
  # in follow-up PRs. Excluded from lint-java because semanticdb-scalac_2.13.17 is not yet
  # published and the lint job activates -Psemanticdb.
  build-spark-4-1:
    needs: lint
    name: Build Spark 4.1, JDK 17
    if: ${{ !inputs.cache-refresh-only && inputs.profiles != 'nightly' }}
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17

      - name: Restore Maven dependencies
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}-spark-4.1-build
          restore-keys: |
            ${{ runner.os }}-java-maven-

      - name: Compile (skip tests)
        run: ./mvnw -B install -DskipTests -Dmaven.test.skip=true -Pspark-4.1

      # Saved only on main: an entry written from a pull request or a
      # `gh-readonly-queue/*` branch cannot be restored by any later run, and
      # it evicts main's from the shared budget. See "Large caches are written
      # on main only" in README.md.
      - name: Save Maven dependencies
        if: ${{ github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}-spark-4.1-build

  celeborn-reflection-compatibility:
    needs: lint
    name: Celeborn ${{ matrix.celeborn_version }} reflection compatibility
    if: ${{ !inputs.cache-refresh-only && inputs.profiles != 'nightly' }}
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
      env:
        JAVA_TOOL_OPTIONS: --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED
    strategy:
      fail-fast: false
      matrix:
        celeborn_version: ["0.6.0", "0.7.0"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17

      - name: Restore Maven dependencies
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}-celeborn-${{ matrix.celeborn_version }}
          restore-keys: |
            ${{ runner.os }}-java-maven-

      - name: Verify reflected Celeborn internals
        env:
          SPARK_LOCAL_HOSTNAME: localhost
          SPARK_LOCAL_IP: 127.0.0.1
        run: |
          SPARK_HOME="$GITHUB_WORKSPACE" ./mvnw -B clean test \
            -Pspark-3.5,scala-2.12,celeborn-reflection-compatibility \
            -Dceleborn.version="${{ matrix.celeborn_version }}" \
            -Dtest=none \
            -Dsuites=org.apache.comet.shuffle.CelebornReflectionCompatibilitySuite \
            -DfailIfNoTests=false

      # Saved only on main: an entry written from a pull request or a
      # `gh-readonly-queue/*` branch cannot be restored by any later run, and
      # it evicts main's from the shared budget. See "Large caches are written
      # on main only" in README.md.
      - name: Save Maven dependencies
        if: ${{ github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}-celeborn-${{ matrix.celeborn_version }}

  # Build native library once and share with all test jobs. Also the owner of
  # main's `cargo-ci` cache entry, which is why it runs in cache-refresh-only
  # mode: rebuilding native/target from cold costs every pull request ~20 min.
  build-native:
    needs: lint
    name: Build Native Library
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17  # JDK only needed for JVM module proto generation

      - name: Restore Cargo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}-${{ hashFiles('native/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}-

      - name: Build native library (CI profile)
        run: |
          cd native
          # CI profile: same overflow behavior as release, but faster compilation
          # (no LTO, parallel codegen)
          cargo build --profile ci
        env:
          RUSTFLAGS: "-Ctarget-cpu=x86-64-v3 -Clink-arg=-fuse-ld=bfd"

      - name: Upload native library
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: native-lib-linux
          path: native/target/ci/libcomet.so
          retention-days: 1

      - name: Save Cargo cache
        uses: actions/cache/save@v6
        # The push run is the cache warmer (see the header); a scheduled run
        # at the same sha would only re-archive an entry that already exists.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}-${{ hashFiles('native/**/*.rs') }}

  # Run Rust tests (runs in parallel with build-native, uses debug builds).
  # Owns main's `cargo-debug` cache entry, so it runs in cache-refresh-only mode
  # as well. The tests themselves are a small slice of its runtime -- almost all
  # of it is the compile that populates the cache -- so there is nothing to gain
  # from a compile-only variant, and running them keeps the cache contents
  # identical to what a pull request restores.
  linux-test-rust:
    needs: lint
    name: ubuntu-latest/rust-test
    if: ${{ inputs.profiles != 'nightly' }}
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17

      - name: Restore Cargo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          # Note: Java version intentionally excluded - Rust target is JDK-independent
          key: ${{ runner.os }}-cargo-debug-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}-${{ hashFiles('native/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-debug-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}-

      - name: Rust test steps
        uses: ./.github/actions/rust-test

      - name: Save Cargo cache
        uses: actions/cache/save@v6
        # The push run is the cache warmer (see the header); a scheduled run
        # at the same sha would only re-archive an entry that already exists.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-debug-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}-${{ hashFiles('native/**/*.rs') }}

  linux-test:
    # `lint` is already upstream via build-native; it is listed here so this
    # job can read its `profile-matrix` output.
    needs: [lint, build-native]
    if: ${{ !inputs.cache-refresh-only }}
    strategy:
      matrix:
        # The Spark profiles live in dev/ci/linux-test-profiles.py and are
        # selected by the `profiles` input: the default build profile on a
        # pull request and in the merge queue, the other four in the nightly
        # run. The goal of the full list is coverage of every Java, Scala and
        # Spark version without testing every combination.
        profile: ${{ fromJSON(needs.lint.outputs.profile-matrix) }}
        # Suites are grouped by functional area into balanced buckets so that no test
        # job runs much longer than ~23 min. See
        # docs/superpowers/specs/2026-05-22-pr-build-consolidation-design.md for the
        # per-suite timing analysis behind this grouping.
        suite:
          - name: "scans"
            value: |
              org.apache.comet.parquet.CometParquetWriterSuite
              org.apache.comet.parquet.CometEmptyRelationParquetWriterSuite
              org.apache.comet.parquet.ParquetReadV1Suite
              org.apache.comet.parquet.ParquetReadV2Suite
              org.apache.comet.parquet.ParquetTimestampLtzAsNtzSuite
              org.apache.spark.sql.comet.ParquetDatetimeRebaseV1Suite
              org.apache.spark.sql.comet.ParquetDatetimeRebaseV2Suite
              org.apache.spark.sql.comet.ParquetEncryptionITCase
              org.apache.comet.exec.CometNativeReaderSuite
              org.apache.comet.CometVariantProjectionSuite
              org.apache.spark.sql.CometVariantShreddingSuite
              org.apache.comet.CometIcebergNativeSuite
              org.apache.comet.CometIcebergEncryptionSuite
              org.apache.comet.CometIcebergRewriteActionSuite
              org.apache.comet.CometIcebergWriteActionSuite
              org.apache.comet.CometIcebergWriteDetectionSuite
              org.apache.comet.CometIcebergSystemFunctionSuite
              org.apache.comet.CometIcebergResidualPushdownSuite
              org.apache.comet.iceberg.IcebergReflectionSuite
              org.apache.comet.serde.operator.IcebergWriteProtoTranslationSuite
              org.apache.comet.csv.CometCsvNativeReadSuite
              org.apache.comet.CometFuzzTestSuite
              org.apache.comet.CometFuzzIcebergSuite
              org.apache.comet.DataGeneratorSuite
          - name: "shuffle"
            value: |
              org.apache.comet.exec.CometShuffleSuite
              org.apache.comet.exec.CometShuffle4_0Suite
              org.apache.comet.exec.CometNativeColumnarToRowSuite
              org.apache.comet.exec.CometNativeShuffleSuite
              org.apache.comet.shuffle.CelebornShufflePartitionPusherSuite
              org.apache.spark.sql.comet.execution.shuffle.CometCelebornShuffleManagerSuite
              org.apache.spark.sql.comet.execution.shuffle.CometCelebornNativeShuffleWriterSuite
              org.apache.spark.sql.comet.execution.shuffle.CometCelebornShuffleFallbackSuite
              org.apache.spark.sql.comet.execution.shuffle.CometCelebornConcurrentMaterializationSuite
              org.apache.spark.sql.comet.execution.shuffle.CometCelebornShuffleStatisticsSuite
              org.apache.spark.sql.comet.execution.shuffle.CometCelebornLocalFetchFailureSuite
              org.apache.spark.sql.comet.execution.shuffle.CometCelebornShuffleReaderSuite
              org.apache.spark.sql.comet.execution.shuffle.CometCelebornShufflePlanningSuite
              org.apache.spark.sql.comet.execution.shuffle.CometNativeShuffleInputRDDSuite
              org.apache.spark.sql.comet.execution.shuffle.CometNativeShuffleWriterSuite
              org.apache.spark.sql.comet.execution.shuffle.CometNativePositionalRoundRobinSuite
              org.apache.spark.sql.comet.execution.shuffle.CometDiskBlockWriterSuite
              org.apache.comet.exec.CometShuffleEncryptionSuite
              org.apache.comet.exec.CometShuffleManagerSuite
              org.apache.comet.exec.CometAsyncShuffleSuite
              org.apache.comet.exec.DisableAQECometShuffleSuite
              org.apache.comet.exec.DisableAQECometAsyncShuffleSuite
              org.apache.spark.shuffle.comet.CometUnboundedShuffleMemoryAllocatorSuite
              org.apache.spark.shuffle.sort.SpillSorterSuite
          - name: "exec"
            value: |
              org.apache.comet.exec.CometAggregateSuite
              org.apache.comet.exec.CometExec3_4PlusSuite
              org.apache.comet.exec.CometExecSuite
              org.apache.comet.exec.CometEmptyRelationExecSuite
              org.apache.comet.exec.CometInMemoryCacheSuite
              org.apache.comet.exec.CometInMemoryCacheKryoSuite
              org.apache.comet.exec.CometGenerateExecSuite
              org.apache.comet.exec.CometWindowExecSuite
              org.apache.comet.exec.CometJoinSuite
              org.apache.spark.sql.comet.CometMapInBatchSuite
              org.apache.spark.sql.execution.python.CometArrowPythonRunnerSuite
              org.apache.comet.CometNativeSuite
              org.apache.comet.CometConfSuite
              org.apache.comet.CometPublicApiSuite
              org.apache.comet.QueryContextInternerSuite
              org.apache.comet.CometSetOpWithGroupBySuite
              org.apache.comet.CometSparkSessionExtensionsSuite
              org.apache.spark.sql.comet.CometSessionExtensionsSuite
              org.apache.spark.CometPluginsSuite
              org.apache.spark.CometRuntimeShutdownSuite
              org.apache.spark.CometTaskMemoryManagerSuite
              org.apache.spark.CometExecIteratorLifecycleSuite
              org.apache.spark.CometPluginsDefaultSuite
              org.apache.spark.CometPluginsMemoryOverheadWarningSuite
              org.apache.spark.CometPluginsMemoryPoolFractionWarningSuite
              org.apache.spark.CometPluginsUnifiedModeSuite
              org.apache.spark.CometPluginsExtensionOnlySuite
              org.apache.spark.CometPluginsSparkShuffleManagerSuite
              org.apache.comet.rules.CometScanRuleSuite
              org.apache.comet.rules.CometScanContribSuite
              org.apache.comet.rules.CometScanSchemeFallbackSuite
              org.apache.comet.rules.CometExecRuleSuite
              org.apache.spark.sql.comet.CometPlanEqualitySuite
              org.apache.comet.rules.CometEmptyRelationExecRuleSuite
              org.apache.comet.rules.RevertNativeForTransitionHeavyStagesSuite
              org.apache.spark.sql.CometTPCDSQuerySuite
              org.apache.spark.sql.CometTPCDSQueryTestSuite
              org.apache.spark.sql.CometTPCHQuerySuite
              org.apache.spark.sql.comet.CometTPCDSV1_4_PlanStabilitySuite
              org.apache.spark.sql.comet.CometTPCDSV2_7_PlanStabilitySuite
              org.apache.spark.sql.comet.CometTaskMetricsSuite
              org.apache.spark.sql.comet.CometDppFallbackRepro3949Suite
              org.apache.spark.sql.comet.CometShuffleFallbackStickinessSuite
              org.apache.spark.sql.comet.PlanDataInjectorSuite
              org.apache.spark.sql.comet.PlanDataInjectorShuffleLifecycleSuite
              org.apache.spark.sql.comet.CometDecimalArithmeticViewSuite
              org.apache.spark.sql.comet.CometDecimalPromotionSuite
              org.apache.spark.sql.comet.CometScanWithPlanDataSuite
              org.apache.spark.sql.comet.util.UtilsSuite
              org.apache.comet.vector.NativeUtilSuite
              org.apache.comet.vector.CometVectorUtilsSuite
              org.apache.comet.udf.CometUdfBridgeSuite
              org.apache.comet.objectstore.NativeConfigSuite
              org.apache.comet.serde.operator.CometIcebergNativeScanSuite
              org.apache.comet.serde.operator.CometNativeScanSuite
              org.apache.spark.sql.CometToPrettyStringSuite
              org.apache.spark.sql.CometCollationSuite
              org.apache.comet.CometFuzzAggregateSuite
              org.apache.spark.sql.comet.execution.arrow.CometArrowStreamSuite
              org.apache.spark.sql.CometSparkInternalFunctionsSuite
          - name: "expressions"
            value: |
              org.apache.comet.CometExpressionSuite
              org.apache.comet.GenerateDocsSuite
              org.apache.comet.CometSqlFileTestSuite
              org.apache.comet.SqlFileTestParserSuite
              org.apache.comet.CometExpressionCoverageSuite
              org.apache.comet.CometVariantTypeSuite
              org.apache.comet.CometHashExpressionSuite
              org.apache.comet.CometTemporalExpressionSuite
              org.apache.comet.CometArrayExpressionSuite
              org.apache.comet.CometNativeCastSuite
              org.apache.comet.CometDateTimeUtilsSuite
              org.apache.comet.CometMathExpressionSuite
              org.apache.comet.CometStringExpressionSuite
              org.apache.comet.CometBitwiseExpressionSuite
              org.apache.comet.CometMapExpressionSuite
              org.apache.comet.CometCsvExpressionSuite
              org.apache.comet.CometJsonExpressionSuite
              org.apache.comet.CometJsonJvmSuite
              org.apache.comet.SparkErrorConverterSuite
              org.apache.comet.serde.SerdeRegistrationSuite
              org.apache.comet.expressions.conditional.CometIfSuite
              org.apache.comet.expressions.conditional.CometCoalesceSuite
              org.apache.comet.expressions.conditional.CometCaseWhenSuite
              org.apache.comet.CometRegExpJvmSuite
              org.apache.comet.CometRegexParitySuite
              org.apache.comet.expressions.CometRegexSuite
              org.apache.comet.CometCodegenSuite
              org.apache.comet.CometCoverageStatsSuite
              org.apache.comet.CometCodegenSourceSuite
              org.apache.comet.CometCodegenHOFSuite
              org.apache.comet.CometFuzzMathSuite
              org.apache.comet.CometCodegenFuzzSuite
              org.apache.comet.CometScalaUDFClassLoaderSuite
              org.apache.comet.codegen.CometSpecializedGettersDispatchSuite
              org.apache.comet.CometStringDecodeSuite
              org.apache.comet.CometWidthBucketSuite
              org.apache.comet.CometUuidExpressionSuite
              org.apache.comet.serde.CometScalarFunctionSuite
              org.apache.comet.serde.CometLiteralSuite
              org.apache.comet.serde.QueryPlanSerdeSuite
              org.apache.comet.CometFallbackInvarianceSuite
      fail-fast: false
    name: ${{ matrix.profile.name }} [${{ matrix.suite.name }}]
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
      env:
        JAVA_TOOL_OPTIONS: '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: ${{ matrix.profile.java_version }}

      - name: Download native library
        uses: ./.github/actions/download-artifact-retry
        with:
          name: native-lib-linux
          # Download to release/ since Maven's -Prelease expects libcomet.so there
          path: native/target/release/

      # Restore cargo registry cache (for any cargo commands that might run)
      - name: Restore Cargo registry
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Java test steps
        uses: ./.github/actions/java-test
        with:
          artifact_name: ${{ matrix.profile.name }}-${{ matrix.suite.name }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          suites: ${{ matrix.suite.value }}
          maven_opts: ${{ matrix.profile.maven_opts }}
          upload-test-reports: true
          skip-native-build: true

  # TPC-H correctness test - verifies benchmark queries produce correct results.
  # Runs in cache-refresh-only mode for its two cache entries: the SF=1 dataset,
  # which is expensive to regenerate, and main's shared `java-maven` entry. Only
  # the query run is skipped there; everything up to and including data
  # generation still has to happen for the dataset cache to exist.
  verify-benchmark-results-tpch:
    needs: build-native
    name: Verify TPC-H Results
    if: ${{ inputs.profiles != 'nightly' }}
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    env:
      JAVA_TOOL_OPTIONS: --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17

      - name: Download native library
        uses: ./.github/actions/download-artifact-retry
        with:
          name: native-lib-linux
          path: native/target/release/

      - name: Restore Maven dependencies
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-java-maven-

      - name: Cache TPC-H data
        id: cache-tpch
        uses: actions/cache@v6
        with:
          path: ./tpch
          key: tpch-${{ hashFiles('.github/workflows/pr_build_linux.yml') }}

      - name: Build project
        run: |
          ./mvnw -B -Prelease install -DskipTests

      - name: Generate TPC-H data (SF=1)
        if: steps.cache-tpch.outputs.cache-hit != 'true'
        run: |
          cd spark && MAVEN_OPTS='-Xmx20g' ../mvnw -B -Prelease exec:java -Dexec.mainClass="org.apache.spark.sql.GenTPCHData" -Dexec.classpathScope="test" -Dexec.cleanupDaemonThreads="false" -Dexec.args="--location `pwd`/.. --scaleFactor 1 --numPartitions 1 --overwrite"

      - name: Run TPC-H queries
        if: ${{ !inputs.cache-refresh-only }}
        run: |
          SPARK_HOME=`pwd` SPARK_TPCH_DATA=`pwd`/tpch/sf1_parquet ./mvnw -B -Prelease -Dsuites=org.apache.spark.sql.CometTPCHQuerySuite test

      # Saved only on main: an entry written from a pull request or a
      # `gh-readonly-queue/*` branch cannot be restored by any later run, and
      # it evicts main's from the shared budget. See "Large caches are written
      # on main only" in README.md.
      - name: Save Maven dependencies
        if: ${{ github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}

  # TPC-DS correctness tests - verifies benchmark queries produce correct results.
  # The three join strategies run sequentially in one job so the project is built
  # once. Runs in cache-refresh-only mode for the same reason as the TPC-H job;
  # there the three query passes are skipped and only the dataset generation and
  # the Maven cache remain.
  verify-benchmark-results-tpcds:
    needs: build-native
    name: Verify TPC-DS Results
    if: ${{ inputs.profiles != 'nightly' }}
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    env:
      JAVA_TOOL_OPTIONS: --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17

      - name: Download native library
        uses: ./.github/actions/download-artifact-retry
        with:
          name: native-lib-linux
          path: native/target/release/

      - name: Restore Maven dependencies
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-java-maven-

      - name: Cache TPC-DS data
        id: cache-tpcds
        uses: actions/cache@v6
        with:
          path: ./tpcds-sf-1
          key: tpcds-${{ hashFiles('.github/workflows/pr_build_linux.yml') }}

      - name: Build project
        run: |
          ./mvnw -B -Prelease install -DskipTests

      - name: Checkout tpcds-kit
        if: steps.cache-tpcds.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: databricks/tpcds-kit
          path: ./tpcds-kit

      - name: Build tpcds-kit
        if: steps.cache-tpcds.outputs.cache-hit != 'true'
        run: |
          apt-get update && apt-get install -y yacc bison flex gcc-12 g++-12
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120 --slave /usr/bin/g++ g++ /usr/bin/g++-12
          cd tpcds-kit/tools && make OS=LINUX

      - name: Generate TPC-DS data (SF=1)
        if: steps.cache-tpcds.outputs.cache-hit != 'true'
        run: |
          cd spark && MAVEN_OPTS='-Xmx20g' ../mvnw -B -Prelease exec:java -Dexec.mainClass="org.apache.spark.sql.GenTPCDSData" -Dexec.classpathScope="test" -Dexec.cleanupDaemonThreads="false" -Dexec.args="--dsdgenDir `pwd`/../tpcds-kit/tools --location `pwd`/../tpcds-sf-1 --scaleFactor 1 --numPartitions 1"

      - name: Run TPC-DS queries (Sort merge join)
        if: ${{ !inputs.cache-refresh-only }}
        run: |
          SPARK_HOME=`pwd` SPARK_TPCDS_DATA=`pwd`/tpcds-sf-1 ./mvnw -B -Prelease -Dsuites=org.apache.spark.sql.CometTPCDSQuerySuite test
        env:
          SPARK_TPCDS_JOIN_CONF: |
            spark.sql.autoBroadcastJoinThreshold=-1
            spark.sql.join.preferSortMergeJoin=true

      - name: Run TPC-DS queries (Broadcast hash join)
        if: ${{ !inputs.cache-refresh-only }}
        run: |
          SPARK_HOME=`pwd` SPARK_TPCDS_DATA=`pwd`/tpcds-sf-1 ./mvnw -B -Prelease -Dsuites=org.apache.spark.sql.CometTPCDSQuerySuite test
        env:
          SPARK_TPCDS_JOIN_CONF: |
            spark.sql.autoBroadcastJoinThreshold=10485760

      - name: Run TPC-DS queries (Shuffled hash join)
        if: ${{ !inputs.cache-refresh-only }}
        run: |
          SPARK_HOME=`pwd` SPARK_TPCDS_DATA=`pwd`/tpcds-sf-1 ./mvnw -B -Prelease -Dsuites=org.apache.spark.sql.CometTPCDSQuerySuite test
        env:
          SPARK_TPCDS_JOIN_CONF: |
            spark.sql.autoBroadcastJoinThreshold=-1
            spark.sql.join.forceApplyShuffledHashJoin=true

      # Saved only on main: an entry written from a pull request or a
      # `gh-readonly-queue/*` branch cannot be restored by any later run, and
      # it evicts main's from the shared budget. See "Large caches are written
      # on main only" in README.md.
      - name: Save Maven dependencies
        if: ${{ github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}
