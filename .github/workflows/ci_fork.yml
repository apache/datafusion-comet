# Fork runs: a push to a branch of a contributor's fork runs the pull request
# tier on the contributor's own GitHub runners, so a fork pull request does not
# spend ASF's shared capacity on it. ci.yml upstream skips the PR tier for a
# fork pull request into main (see `is_fork_pull_request` in
# dev/ci/compute-changes.py), keeping only the preflight checks and the opt-in
# `run-*` suites, and fork_ci_status.yml mirrors this run onto the pull request
# as the informational `CI (fork)` check. The merge queue runs the queue tier on
# the merge result, so a fork run is feedback and never a gate.
#
# This is a separate workflow, and not a wider `push` trigger on ci.yml, for the
# same reason ci_label.yml is one. A skipped job still publishes a check run
# under its own name, and a push to a branch of this repository can land on the
# very commit a pull request is testing. A skipped `Required Checks` from that
# push would compete with the pull request's real verdict. Here the only job
# that can be skipped is named after this workflow's own run, and upstream it is
# always skipped.
#
# A fork's default branch is excluded because a push to it is a sync of upstream,
# which the merge queue already tested. ci.yml still triggers on a push to `main`
# there, but its Preflight job skips that run. A fork's caches are therefore never
# warm; see "Pull requests from forks" in docs/source/contributor-guide/ci.md for
# what that costs.
name: Comet CI (fork run)

# No `concurrency` here. ci.yml declares its own group, which for a push to a
# fork is keyed on the branch, so the next push to the branch supersedes this
# one. The same group on the caller as well would deadlock the two.
on:
  push:
    branches-ignore:
      - main
      - asf-site

permissions:
  contents: read

jobs:
  ci:
    name: Fork run
    # Upstream, a push to any branch other than main is a pull request's own
    # business: the pull request run tests it, and a second run here would
    # test it twice. In a fork the default branch is skipped, whatever it is
    # called; `branches-ignore` above can only name `main`.
    if: github.repository != 'apache/datafusion-comet' && github.ref_name != github.event.repository.default_branch
    # The union of what ci.yml's jobs request, for the same reason as in
    # ci_label.yml: GitHub checks a called workflow's permissions against
    # this ceiling for every job when the run starts, including the ones this
    # event skips.
    permissions:
      actions: read
      contents: write
      issues: write
    uses: ./.github/workflows/ci.yml
