name: PR Build (macOS)

# Reusable: invoked by ci.yml. Triggering, path filters, and concurrency
# live in the umbrella workflow.
#
# Two modes, selected by `cache-refresh-only`, the same split as
# pr_build_linux.yml:
#
#   false  the full pipeline: the native build and the test matrix. The merge
#          queue, and pull requests carrying `run-macos-tests`.
#   true   `build-native` alone, and only far enough to keep main's macOS cargo
#          cache warm. This is the push-to-main tier. Nothing else ever runs on
#          main, and a cache entry written anywhere else is invisible to the
#          queue, so without this run every queue build compiled the native
#          library from scratch. See issue #6390.
on:
  workflow_call:
    inputs:
      cache-refresh-only:
        description: >-
          Populate main's macOS cargo cache without running any test. Set by
          ci.yml on push to main.
        type: boolean
        default: false

env:
  RUST_VERSION: stable
  RUST_BACKTRACE: 1

jobs:

  # Fast lint check - gates all other jobs (runs on Linux for cost efficiency)
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7

      - name: Check Rust formatting
        run: |
          rustup component add rustfmt
          cd native && cargo fmt --all -- --check

  # Build native library once and share with all test jobs. Also the owner of
  # main's macOS `cargo-ci-v2` cache entry, which is why it runs in
  # cache-refresh-only mode. The key covers the dependency set only, as in
  # pr_build_linux.yml, so the push run builds once per dependency change and
  # otherwise stops at the lookup.
  build-native:
    needs: lint
    name: Build Native Library (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      # In cache-refresh-only mode this job is only here to write the entry, so
      # if the entry already exists there is nothing left to do.
      - name: Look up Cargo cache
        id: cargo-lookup
        if: ${{ inputs.cache-refresh-only }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-v2-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}
          lookup-only: true

      - name: Setup Rust & Java toolchain
        if: steps.cargo-lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-macos-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17
          jdk-architecture: aarch64
          protoc-architecture: aarch_64

      - name: Restore Cargo cache
        id: cargo-cache
        if: steps.cargo-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-v2-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}

      - name: Build native library (CI profile)
        if: steps.cargo-lookup.outputs.cache-hit != 'true'
        run: |
          cd native
          # CI profile: same overflow behavior as release, but faster compilation
          # (no LTO, parallel codegen)
          cargo build --profile ci
        env:
          RUSTFLAGS: "-Ctarget-cpu=apple-m1"

      - name: Upload native library
        if: ${{ !inputs.cache-refresh-only }}
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: native-lib-macos
          # libcomet_test_udfs is the cdylib CometNativeUdfSuite loads; it is built by the same
          # cargo invocation and the suite finds it next to libcomet.
          path: |
            native/target/ci/libcomet.dylib
            native/target/ci/libcomet_test_udfs.dylib
          retention-days: 1

      - name: Save Cargo cache
        uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.cargo-lookup.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-v2-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}

  macos-aarch64-test:
    needs: build-native
    if: ${{ !inputs.cache-refresh-only }}
    strategy:
      matrix:
        os: [macos-14]

        # macOS runs cover platform-specific concerns (native library loading, FFI,
        # threading, shuffle on Apple Silicon) that are largely independent of the
        # Spark/Scala/JDK version. Full matrix coverage already happens on Linux,
        # so we run only the newest supported profile here.
        profile:
          - name: "Spark 4.0, JDK 17, Scala 2.13"
            java_version: "17"
            maven_opts: "-Pspark-4.0 -Pscala-2.13"

        # One job per test group. A suite is in the group its tag names; see
        # "Test Groups" in docs/source/contributor-guide/development.md.
        suite: [scans, shuffle, exec, expressions]
      fail-fast: false
    name: ${{ matrix.os }}/${{ matrix.profile.name }} [${{ matrix.suite }}]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-macos-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: ${{ matrix.profile.java_version }}
          jdk-architecture: aarch64
          protoc-architecture: aarch_64

      - name: Download native library
        uses: ./.github/actions/download-artifact-retry
        with:
          name: native-lib-macos
          # Download to release/ since Maven's -Prelease expects libcomet.dylib there
          path: native/target/release/

      # Restore cargo registry cache (for any cargo commands that might run)
      - name: Restore Cargo registry
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Set thread thresholds envs for spark test on macOS
        # see: https://github.com/apache/datafusion-comet/issues/2965
        shell: bash
        run: |
          echo "SPARK_TEST_SQL_SHUFFLE_EXCHANGE_MAX_THREAD_THRESHOLD=256" >> $GITHUB_ENV
          echo "SPARK_TEST_SQL_RESULT_QUERY_STAGE_MAX_THREAD_THRESHOLD=256" >> $GITHUB_ENV
          echo "SPARK_TEST_HIVE_SHUFFLE_EXCHANGE_MAX_THREAD_THRESHOLD=48" >> $GITHUB_ENV
          echo "SPARK_TEST_HIVE_RESULT_QUERY_STAGE_MAX_THREAD_THRESHOLD=48" >> $GITHUB_ENV

      - name: Java test steps
        uses: ./.github/actions/java-test
        with:
          artifact_name: ${{ matrix.os }}-${{ matrix.profile.name }}-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          group: ${{ matrix.suite }}
          maven_opts: ${{ matrix.profile.maven_opts }}
          skip-native-build: true
