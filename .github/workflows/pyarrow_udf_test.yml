name: PyArrow UDF Tests

# Reusable: invoked by ci.yml. Triggering, path filters, and concurrency
# live in the umbrella workflow. The list of files this suite covers is the
# `pyarrow_udf` entry in FILTERS in dev/ci/compute-changes.py.
on:
  workflow_call:

permissions:
  contents: read

env:
  RUST_VERSION: stable
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-Clink-arg=-fuse-ld=bfd"

jobs:
  pyarrow-udf:
    name: PyArrow UDF (${{ matrix.name }}, JDK 17, Python 3.11)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run a real Python worker against each 4.x runner. Their constructor, command framing,
          # and `writeUDF` shapes differ, so a wiring divergence would otherwise slip through.
          - name: Spark 4.0
            maven_profiles: "-Pspark-4.0 -Pscala-2.13"
            pyspark: "4.0.4"
          - name: Spark 4.1
            maven_profiles: "-Pspark-4.1"
            pyspark: "4.1.3"
          - name: Spark 4.2
            maven_profiles: "-Pspark-4.2"
            pyspark: "4.2.0"
    container:
      # Pinned to the Debian 12 (bookworm) base so the system `python3` is 3.11. The default
      # `amd64/rust` image is Debian 13 (trixie) which ships Python 3.13 and no python3.11 apt
      # package, breaking `apt-get install python3.11`.
      image: rust:bookworm
      env:
        JAVA_TOOL_OPTIONS: "--add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17

      - name: Restore Maven dependencies
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}-pyarrow-udf-${{ matrix.pyspark }}
          restore-keys: |
            ${{ runner.os }}-java-maven-

      - name: Build Comet (debug, ${{ matrix.name }} / Scala 2.13)
        run: |
          cd native && cargo build
          cd .. && ./mvnw -B install -DskipTests ${{ matrix.maven_profiles }}

      - name: Install Python 3.11 and pip
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv python3-pip
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install "pyspark==${{ matrix.pyspark }}" "pyarrow>=14" pandas pytest

      - name: Run PyArrow UDF pytest
        env:
          # Spark launches Python workers in a fresh subprocess and looks up `python3`
          # on PATH unless PYSPARK_PYTHON is set. Without this, workers use the system
          # python which has no pyarrow installed and UDF execution fails with
          # ModuleNotFoundError.
          PYSPARK_PYTHON: /tmp/venv/bin/python
          PYSPARK_DRIVER_PYTHON: /tmp/venv/bin/python
        run: |
          /tmp/venv/bin/python -m pytest -v \
            spark/src/test/resources/pyspark/test_pyarrow_udf.py
          /tmp/venv/bin/python -m pytest -v \
            spark/src/test/resources/pyspark/test_pyarrow_udf_dictionary_shuffle.py

      # Saved only on main: an entry written from a pull request or a
      # `gh-readonly-queue/*` branch cannot be restored by any later run, and
      # it evicts main's from the shared budget. See "Large caches are written
      # on main only" in README.md.
      - name: Save Maven dependencies
        if: ${{ github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}-pyarrow-udf-${{ matrix.pyspark }}
