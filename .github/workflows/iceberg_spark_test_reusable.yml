# Reusable Iceberg Spark test workflow. Invoked once per Iceberg version by
# the iceberg_spark_test_<version>.yml caller workflows. Keep all job logic
# here so the per-version callers stay thin.

name: Iceberg Spark SQL Tests (reusable)

on:
  workflow_call:
    inputs:
      native-library-artifact:
        description: 'Default Linux CI library produced by the calling workflow'
        required: true
        type: string
      iceberg-short:
        description: 'Iceberg minor version, e.g. 1.10'
        required: true
        type: string
      iceberg-full:
        description: 'Iceberg full version, e.g. 1.10.0'
        required: true
        type: string
      spark-short:
        description: 'Spark minor version, e.g. 3.5'
        required: true
        type: string
      spark-full:
        description: 'Spark full version, e.g. 3.5.9'
        required: true
        type: string
      java:
        description: 'JDK major version, e.g. 17'
        required: true
        type: number
      scala:
        description: 'Scala minor version, e.g. 2.13'
        required: false
        default: '2.13'
        type: string

env:
  RUST_VERSION: stable
  RUST_BACKTRACE: 1
  # Force GNU ld on Linux: recent Rust stable defaults to rust-lld on
  # x86_64-unknown-linux-gnu, and rust-lld cannot resolve -ljvm against the
  # Zulu JDK layout installed by setup-java. Keep bfd for all cargo invocations.
  RUSTFLAGS: "-Clink-arg=-fuse-ld=bfd"

jobs:
  # The calling workflow has already built the shared native library.
  prepare-shards:
    name: Define Iceberg test shards
    runs-on: ubuntu-slim
    outputs:
      shard-matrix: ${{ steps.shards.outputs.matrix }}
      shard-count: ${{ steps.shards.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: Define Iceberg test shards
        id: shards
        run: python3 dev/ci/check-iceberg-shards.py --github-output "$GITHUB_OUTPUT"

  iceberg-spark:
    needs: prepare-shards
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-shards.outputs.shard-matrix) }}
    name: iceberg-spark/iceberg-${{ inputs.iceberg-full }}/spark-${{ inputs.spark-full }}/scala-${{ inputs.scala }}/java-${{ inputs.java }}/shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    env:
      SPARK_LOCAL_IP: localhost
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: ${{ inputs.java }}
      - name: Download native library
        uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.native-library-artifact }}
          path: native/target/release/
      - name: Build Comet
        run: |
          ./mvnw install -Prelease -DskipTests -Pspark-${{ inputs.spark-short }} -Pscala-${{ inputs.scala }}
      - name: Setup Iceberg
        uses: ./.github/actions/setup-iceberg-builder
        with:
          iceberg-version: ${{ inputs.iceberg-full }}
      - name: Run Iceberg Spark tests
        run: |
          cd apache-iceberg
          rm -rf /root/.m2/repository/org/apache/parquet # somehow parquet cache requires cleanups
          ENABLE_COMET=true ENABLE_COMET_ONHEAP=true ./gradlew -DsparkVersions=${{ inputs.spark-short }} -DscalaVersion=${{ inputs.scala }} -DflinkVersions= -DkafkaVersions= \
            :iceberg-spark:iceberg-spark-${{ inputs.spark-short }}_${{ inputs.scala }}:test \
            --init-script ../dev/ci/iceberg-test-shards.gradle \
            -PcometShardTask=:iceberg-spark:iceberg-spark-${{ inputs.spark-short }}_${{ inputs.scala }}:test \
            -PcometShardIndex=${{ matrix.shard }} -PcometShardCount=${{ needs.prepare-shards.outputs.shard-count }} \
            -Pquick=true -x javadoc
      - name: Upload Iceberg shard inventory and test reports
        if: ${{ !cancelled() }}
        # iceberg-spark-shard-coverage downloads the inventory, so a flaky
        # upload here fails that job too. Retry rather than fail on the first 403.
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: iceberg-spark-${{ inputs.iceberg-full }}-spark-${{ inputs.spark-full }}-scala-${{ inputs.scala }}-jdk${{ inputs.java }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            apache-iceberg/**/build/comet-shards/*.json
            apache-iceberg/**/build/test-results/test/*.xml
          retention-days: 7

  iceberg-spark-shard-coverage:
    needs: iceberg-spark
    if: ${{ !cancelled() }}
    name: iceberg-spark-shard-coverage/iceberg-${{ inputs.iceberg-full }}/spark-${{ inputs.spark-full }}/scala-${{ inputs.scala }}/java-${{ inputs.java }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Download Iceberg shard inventories
        uses: ./.github/actions/download-artifact-retry
        with:
          # Download all attempts: a failed-job rerun retains earlier successful
          # shards. The checker selects the latest inventory for each index.
          pattern: iceberg-spark-${{ inputs.iceberg-full }}-spark-${{ inputs.spark-full }}-scala-${{ inputs.scala }}-jdk${{ inputs.java }}-shard-*-attempt-*
          path: iceberg-shard-reports
      - name: Verify complete, disjoint Iceberg candidate coverage
        run: |
          python3 dev/ci/check-iceberg-shards.py --manifests iceberg-shard-reports \
            --task :iceberg-spark:iceberg-spark-${{ inputs.spark-short }}_${{ inputs.scala }}:test

  iceberg-spark-extensions:
    needs: prepare-shards
    name: iceberg-spark-extensions/iceberg-${{ inputs.iceberg-full }}/spark-${{ inputs.spark-full }}/scala-${{ inputs.scala }}/java-${{ inputs.java }}
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    env:
      SPARK_LOCAL_IP: localhost
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: ${{ inputs.java }}
      - name: Download native library
        uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.native-library-artifact }}
          path: native/target/release/
      - name: Build Comet
        run: |
          ./mvnw install -Prelease -DskipTests -Pspark-${{ inputs.spark-short }} -Pscala-${{ inputs.scala }}
      - name: Setup Iceberg
        uses: ./.github/actions/setup-iceberg-builder
        with:
          iceberg-version: ${{ inputs.iceberg-full }}
      - name: Run Iceberg Spark extensions tests
        run: |
          cd apache-iceberg
          rm -rf /root/.m2/repository/org/apache/parquet # somehow parquet cache requires cleanups
          ENABLE_COMET=true ENABLE_COMET_ONHEAP=true ./gradlew -DsparkVersions=${{ inputs.spark-short }} -DscalaVersion=${{ inputs.scala }} -DflinkVersions= -DkafkaVersions= \
            :iceberg-spark:iceberg-spark-extensions-${{ inputs.spark-short }}_${{ inputs.scala }}:test \
            -Pquick=true -x javadoc

  iceberg-spark-runtime:
    needs: prepare-shards
    name: iceberg-spark-runtime/iceberg-${{ inputs.iceberg-full }}/spark-${{ inputs.spark-full }}/scala-${{ inputs.scala }}/java-${{ inputs.java }}
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    env:
      SPARK_LOCAL_IP: localhost
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust & Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: ${{ inputs.java }}
      - name: Download native library
        uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.native-library-artifact }}
          path: native/target/release/
      - name: Build Comet
        run: |
          ./mvnw install -Prelease -DskipTests -Pspark-${{ inputs.spark-short }} -Pscala-${{ inputs.scala }}
      - name: Setup Iceberg
        uses: ./.github/actions/setup-iceberg-builder
        with:
          iceberg-version: ${{ inputs.iceberg-full }}
      - name: Verify test sharding preserves discovery
        run: python3 dev/ci/check-iceberg-shards.py --gradle "$PWD/apache-iceberg/gradlew"
      - name: Run Iceberg Spark runtime tests
        run: |
          cd apache-iceberg
          rm -rf /root/.m2/repository/org/apache/parquet # somehow parquet cache requires cleanups
          ENABLE_COMET=true ENABLE_COMET_ONHEAP=true ./gradlew -DsparkVersions=${{ inputs.spark-short }} -DscalaVersion=${{ inputs.scala }} -DflinkVersions= -DkafkaVersions= \
            :iceberg-spark:iceberg-spark-runtime-${{ inputs.spark-short }}_${{ inputs.scala }}:integrationTest \
            -Pquick=true -x javadoc
