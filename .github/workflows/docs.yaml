name: Deploy DataFusion Comet site

# Reusable: invoked by ci.yml. Triggering and path filters live in the
# umbrella workflow.
on:
  workflow_call:

jobs:
  build-docs:
    name: Build docs
    if: ${{ startsWith(github.repository, 'apache/') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout docs sources
        uses: actions/checkout@v7

      - name: Checkout asf-site branch
        uses: actions/checkout@v7
        with:
          ref: asf-site
          path: asf-site

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install mermaid-cli
        # Draws the ```mermaid fences into SVG at build time. Without mmdc on PATH the build
        # still succeeds but silently drops every diagram, so it is installed unconditionally.
        # See mermaid_output_format in docs/source/conf.py for why the browser cannot draw them.
        run: npm install -g @mermaid-js/mermaid-cli@11.17.0

      - name: Install dependencies
        run: |
          set -x
          python3 -m venv venv
          source venv/bin/activate
          pip install -r docs/requirements.txt

      - name: Build docs
        run: |
          set -x
          source venv/bin/activate
          cd docs
          ./build.sh

      - name: Copy & push the generated HTML
        run: |
          set -x
          cd asf-site/
          rsync \
            -a \
            --delete \
            --exclude '/.git/' \
            ../docs/build/html/ \
            ./
          cp ../.asf.yaml .
          touch .nojekyll
          git status --porcelain
          if [ "$(git status --porcelain)" != "" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m 'Publish built docs triggered by ${{ github.sha }}'
            git push || git push --force
          fi