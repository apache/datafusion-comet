name: "Upload Artifact (with retry)"
description: >
  Drop-in replacement for actions/upload-artifact that retries the upload up to
  three times.

  The artifact client (@actions/artifact) already retries its own HTTP calls,
  but only for 429/500/502/503/504. A FinalizeArtifact call that comes back
  "(403) Forbidden: Error from intermediary" is classified as non-retryable and
  fails the step outright, even though the blob content uploaded fine and a
  fresh attempt normally succeeds. There is no input or environment variable to
  widen that list, and GitHub Actions has no built-in step-level retry, so the
  retry has to live outside the action.

  Third-party retry wrappers (Wandalen/wretry.action and friends) are not on
  the Apache org's allowed-actions list, hence this local composite.

inputs:
  # Mirrors of actions/upload-artifact@v7's inputs. Defaults match that action
  # so pass-through is transparent; the boolean ones must carry a real
  # 'true'/'false' because core.getBooleanInput() throws on an empty string.
  name:
    description: 'Artifact name'
    required: false
    default: 'artifact'
  path:
    description: 'A file, directory or wildcard pattern that describes what to upload'
    required: true
  if-no-files-found:
    description: "Behavior if no files are found: warn, error or ignore"
    required: false
    default: 'warn'
  retention-days:
    description: 'Days before the artifact expires (empty means repository default)'
    required: false
    default: ''
  compression-level:
    description: 'Zlib compression level 0-9 (empty means the action default)'
    required: false
    default: ''
  overwrite:
    description: 'Delete an existing artifact with the same name before uploading'
    required: false
    default: 'false'
  include-hidden-files:
    description: 'Include hidden files in the artifact'
    required: false
    default: 'false'
  archive:
    description: 'Zip the content before uploading'
    required: false
    default: 'true'

outputs:
  artifact-id:
    description: 'ID of the uploaded artifact, from whichever attempt succeeded'
    value: ${{ steps.attempt-1.outputs.artifact-id || steps.attempt-2.outputs.artifact-id || steps.attempt-3.outputs.artifact-id }}
  artifact-url:
    description: 'Download URL of the uploaded artifact'
    value: ${{ steps.attempt-1.outputs.artifact-url || steps.attempt-2.outputs.artifact-url || steps.attempt-3.outputs.artifact-url }}
  artifact-digest:
    description: 'SHA-256 digest of the uploaded artifact'
    value: ${{ steps.attempt-1.outputs.artifact-digest || steps.attempt-2.outputs.artifact-digest || steps.attempt-3.outputs.artifact-digest }}

runs:
  using: "composite"
  steps:
    # continue-on-error keeps a failed attempt from failing the job while still
    # recording outcome == 'failure', which is what the later attempts gate on.
    # The last attempt deliberately omits it so a genuinely broken upload still
    # fails loudly.
    - name: Upload ${{ inputs.name }} (attempt 1 of 3)
      id: attempt-1
      uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}

    - name: Wait before retrying ${{ inputs.name }}
      if: ${{ steps.attempt-1.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::warning::Upload of '${{ inputs.name }}' failed; retrying in 15s (attempt 2 of 3)."
        sleep 15

    # Retries force overwrite: attempt 1 may have created a server-side artifact
    # record before failing, and CreateArtifact rejects a duplicate name. The
    # delete is best effort inside upload-artifact, so it is a no-op when
    # nothing exists.
    - name: Upload ${{ inputs.name }} (attempt 2 of 3)
      id: attempt-2
      if: ${{ steps.attempt-1.outcome == 'failure' }}
      uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: 'true'
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}

    - name: Wait before final retry of ${{ inputs.name }}
      if: ${{ steps.attempt-1.outcome == 'failure' && steps.attempt-2.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::warning::Upload of '${{ inputs.name }}' failed again; retrying in 45s (attempt 3 of 3)."
        sleep 45

    - name: Upload ${{ inputs.name }} (attempt 3 of 3)
      id: attempt-3
      if: ${{ steps.attempt-1.outcome == 'failure' && steps.attempt-2.outcome == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: 'true'
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
