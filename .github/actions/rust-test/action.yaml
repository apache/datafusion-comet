name: "Rust Test"
description: "Run Rust tests"

runs:
  using: "composite"
  steps:
    # Note: cargo fmt check is now handled by the lint job that gates this workflow

    - name: Check Cargo clippy
      shell: bash
      run: |
        cd native
        cargo clippy --color=never --all-targets --workspace -- -D warnings

    - name: Check compilation
      shell: bash
      run: |
        cd native
        cargo check --benches

    - name: Check unused dependencies
      shell: bash
      run: |
        cd native
        cargo install cargo-machete --version 0.7.0 && cargo machete

    - name: Restore Maven dependencies
      id: maven-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.m2/repository
          /root/.m2/repository
        key: ${{ runner.os }}-rust-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-rust-maven-

    - name: Build common module (pre-requisite for Rust tests)
      shell: bash
      run: |
        cd common
        ../mvnw -B clean compile -DskipTests

    # Saved only on main: an entry written from a pull request or a
    # `gh-readonly-queue/*` branch cannot be restored by any later run, and it
    # evicts main's from the shared budget. See "Large caches are written on
    # main only" in ../../workflows/README.md.
    - name: Save Maven dependencies
      if: ${{ github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.m2/repository
          /root/.m2/repository
        key: ${{ runner.os }}-rust-maven-${{ hashFiles('**/pom.xml') }}

    - name: Install nextest
      shell: bash
      run: |
        cargo install cargo-nextest --locked

    - name: Run Cargo test
      shell: bash
      run: |
        cd native
        # Set LD_LIBRARY_PATH to include JVM library path for tests that use JNI
        export LD_LIBRARY_PATH=${JAVA_HOME}/lib/server:${LD_LIBRARY_PATH}
        RUST_BACKTRACE=1 cargo nextest run

    # The steps above lint and test the accounting allocator over the system allocator. Lint and
    # test it over jemalloc too, since that is a different allocator backend and nothing else in CI
    # builds it.
    - name: Check and test the jemalloc allocator backend
      shell: bash
      run: |
        cd native
        export LD_LIBRARY_PATH=${JAVA_HOME}/lib/server:${LD_LIBRARY_PATH}
        cargo clippy --color=never -p datafusion-comet --all-targets --features jemalloc -- -D warnings
        RUST_BACKTRACE=1 cargo nextest run -p datafusion-comet --lib --features jemalloc alloc_accounting
