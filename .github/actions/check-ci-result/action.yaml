name: Check CI result
description: Require every planned CI workflow to finish successfully
inputs:
  needs-json:
    description: JSON of the caller job's complete needs context
    required: true
runs:
  using: composite
  steps:
    - name: Verify planned CI results
      shell: bash
      env:
        CI_NEEDS_JSON: ${{ inputs.needs-json }}
      run: python3 "$GITHUB_WORKSPACE/dev/ci/check-ci-result.py"
