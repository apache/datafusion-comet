name: Setup Spark Builder
description: 'Setup Apache Spark to run SQL tests'
inputs:
  spark-short-version:
    description: 'The Apache Spark short version (e.g., 3.5) to build'
    required: true
  spark-version:
    description: 'The Apache Spark version (e.g., 3.5.9) to build'
    required: true
  skip-native-build:
    description: 'Skip native build (when using pre-built artifact)'
    required: false
    default: 'false'
  skip-spark-clone:
    description: 'Skip cloning Spark and applying patches (when apache-spark/ is pre-staged from a build-jvm artifact)'
    required: false
    default: 'false'
  sbt-projects:
    description: 'Space-separated Spark projects whose test dependencies are needed'
    required: false
    default: 'catalyst sql hive'
runs:
  using: "composite"
  steps:
    - name: Clone Spark repo
      if: ${{ inputs.skip-spark-clone != 'true' }}
      uses: actions/checkout@v6
      with:
        repository: apache/spark
        path: apache-spark
        ref: v${{inputs.spark-version}}
        fetch-depth: 1

    - name: Setup Spark for Comet
      if: ${{ inputs.skip-spark-clone != 'true' }}
      shell: bash
      run: |
        cd apache-spark
        git apply ../dev/diffs/${{inputs.spark-version}}.diff

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          /root/.m2/repository
        key: ${{ runner.os }}-spark-sql-${{ hashFiles('common/**/pom.xml', 'spark/**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-spark-sql-

    - name: Setup Maven
      uses: ./.github/actions/setup-maven

    - name: Build Comet (with native)
      if: ${{ inputs.skip-native-build != 'true' }}
      shell: bash
      run: |
        PROFILES="-Pspark-${{inputs.spark-short-version}}" make release

    - name: Build Comet (Maven only, skip native)
      if: ${{ inputs.skip-native-build == 'true' }}
      shell: bash
      run: |
        # Native library should already be in native/target/release/
        ./mvnw install -Prelease -DskipTests -Pspark-${{inputs.spark-short-version}}

    - name: Purge partial Maven cache entries
      shell: bash
      run: |
        # Comet's Maven phase resolves the dependency graph and downloads POMs
        # for transitive artifacts whose JARs it never actually needs. When sbt
        # then resolves Spark's deps, Coursier sees the POM in mavenLocal,
        # declares the artifact "found locally", and fails on the missing JAR
        # without falling back to Maven Central. Delete those partial entries
        # so sbt re-fetches the full artifact remotely.
        for repo in "$HOME/.m2/repository" /root/.m2/repository; do
          [ -d "$repo" ] || continue
          find "$repo" -name '*.pom' | while read -r pom; do
            jar="${pom%.pom}.jar"
            [ -f "$jar" ] && continue
            grep -q '<packaging>jar</packaging>\|<packaging>bundle</packaging>' "$pom" 2>/dev/null || continue
            rm -f "$pom" "${pom}.sha1" "${pom%.pom}.pom.lastUpdated" \
              "$(dirname "$pom")/_remote.repositories"
          done
        done

    - name: Remove incomplete Parquet test dependencies
      shell: bash
      run: |
        # Maven installs Parquet POMs and main JARs, but not all test classifiers.
        # Coursier treats those entries as local and will not fetch the missing
        # tests.jar remotely. Do this before dependency resolution, not tests.
        rm -rf "$HOME/.m2/repository/org/apache/parquet" /root/.m2/repository/org/apache/parquet

    - name: Restore SBT dependency cache
      id: sbt-dependencies
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/coursier
          /root/.cache/coursier
          ~/.sbt/boot
          /root/.sbt/boot
          ~/.ivy2/cache
          /root/.ivy2/cache
        key: ${{ runner.os }}-${{ runner.arch }}-spark-sbt-v1-${{ inputs.spark-version }}-${{ hashFiles('**/pom.xml', '!**/target/**', 'apache-spark/project/build.properties', 'apache-spark/project/*.sbt', 'apache-spark/project/*.scala') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-spark-sbt-v1-${{ inputs.spark-version }}-

    - name: Resolve Spark dependencies
      shell: bash
      env:
        SBT_PROJECTS: ${{ inputs.sbt-projects }}
      run: |
        cd apache-spark
        read -r -a projects <<< "$SBT_PROJECTS"
        ../dev/ci/resolve-spark-dependencies.sh "${projects[@]}"

    # Keep a successful download even if a later compilation or test fails.
    # Only the build job, which resolves all three projects, may publish this
    # shared immutable key. A writer-only or shard job must not fill it with
    # partial coverage and prevent the full build from saving its downloads.
    - name: Save SBT dependency cache
      if: inputs.sbt-projects == 'catalyst sql hive' && steps.sbt-dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/coursier
          /root/.cache/coursier
          ~/.sbt/boot
          /root/.sbt/boot
          ~/.ivy2/cache
          /root/.ivy2/cache
        key: ${{ steps.sbt-dependencies.outputs.cache-primary-key }}
