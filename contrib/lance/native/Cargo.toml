[package]
name = "comet-contrib-lance"
description = "Native Lance scan integration for Apache DataFusion Comet"
version = "1.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
datafusion = { version = "55.0.0", default-features = false }
datafusion-comet-proto = { path = "../../../native/proto" }
