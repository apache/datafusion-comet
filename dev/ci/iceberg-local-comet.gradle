// Iceberg's build lists mavenCentral() before mavenLocal(), and Gradle takes each module from
// the first repository that has it. On a release branch whose Comet version is already
// published, the tests would then load Comet from Maven Central instead of the jar that
// `./mvnw install` just built. Resolve Comet from the local repository only, so the tests run
// the code under test and fail if it was not installed.
allprojects {
  repositories {
    exclusiveContent {
      forRepository { mavenLocal() }
      filter { includeGroup 'org.apache.datafusion' }
    }
  }
}
