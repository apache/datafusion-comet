# version or NOTICE text requires review during regeneration.

[[codegen]]
disposition = "generated-code"
reason = "Emits runtime impls, wrappers or data tables. Retain the generator's terms for its output; exclude its host-only parsing/quoting dependencies."
packages = [
    "async-trait 0.1.92",
    "aws-smithy-runtime-api-macros 1.1.0",
    "bon-macros 3.10.3",
    "datafusion-macros 55.2.0",
    "derive_builder_macro 0.20.2",
    "derive_more-impl 2.1.1",
    "displaydoc 0.2.7",
    "futures-macro 0.3.34",
    "iceberg-property-macro 0.10.1",
    "jni-macros 0.22.4",
    "jni-sys-macros 0.4.1",
    "linktime-proc-macro 0.2.3",
    "ouroboros_macro 0.18.5",
    "pin-project-internal 1.1.13",
    "prost-derive 0.14.4",
    "serde_derive 1.0.229",
    "serde_repr 0.1.21",
    "serde_with_macros 3.24.0",
    "sqlparser_derive 0.5.0",
    "strum_macros 0.27.2",
    "strum_macros 0.28.0",
    "thiserror-impl 2.0.21",
    "tokio-macros 2.7.2",
    "tracing-attributes 0.1.31",
    "typed-builder-macro 0.20.1",
    "typetag-impl 0.2.23",
    "yoke-derive 0.8.4",
    "zerocopy-derive 0.8.63",
    "zerofrom-derive 0.1.8",
    "zerovec-derive 0.11.7",
]

[[codegen]]
disposition = "host-only"
reason = "Darling derives parsing helpers in other proc-macro crates, which execute on the compiler host rather than in libcomet."
packages = ["darling_macro 0.20.11", "darling_macro 0.24.1"]

[[codegen]]
disposition = "host-only"
reason = "Only chooses/repeats user tokens, joins identifiers, or emits random numeric constants; no library implementation is copied into runtime output."
packages = ["const-random-macro 0.1.16", "paste 1.0.15", "rustversion 1.0.23", "seq-macro 0.3.6"]

